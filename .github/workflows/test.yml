name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-source-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked development environment
        run: uv sync --frozen --group dev
      - name: Run reduced CPU source smoke
        run: >-
          uv run --frozen --group dev python -m pytest -q
          tests/assistance/test_broker_close_persistence.py
          tests/assistance/test_execution_cleanup_recovery.py
          tests/assistance/test_lab_snapshot.py
      - name: Check whitespace
        run: git diff --check
