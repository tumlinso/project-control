name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-readonly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked environment
        run: uv sync --frozen
      - name: Run CPU-only tests
        env:
          PROJECT_CONTROL_SKILLS_ROOT: ${{ github.workspace }}/tests/fixtures/skills
        run: uv run python -m unittest discover -s tests -v
      - name: Check whitespace
        run: git diff --check
