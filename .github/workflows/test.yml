name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-source-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked source development environment
        run: scripts/pc-dev setup
      - name: Run fast CPU source smoke
        run: scripts/pc-dev test -q
      - name: Run assistance source boundary tests
        run: >-
          scripts/pc-dev test
          tests/assistance/test_broker_close_persistence.py
          tests/assistance/test_execution_cleanup_recovery.py
          tests/assistance/test_lab_snapshot.py
      - name: Check test imports and collection
        run: scripts/pc-dev test tests --collect-only -q
      - name: Check whitespace
        run: git diff --check
