# Model assets remain external; this file contains paths and policy only.
[host]
model_root = "/mnt/block/core4-models"
cuda_nvcc = "/opt/nvidia/hpc_sdk/Linux_x86_64/26.1/cuda/12.9/bin/nvcc"
cuda_architecture = "sm_70"

[storage]
canonical_root = "/mnt/block/core4-models"
staging_root = "/home/tumlinson/.local/share/core4/staging"
minimum_headroom_bytes = 17179869184
one_candidate_at_a_time = true
verify_sha256_before_execution = true
cleanup_after_execution = true
allow_ram_filesystem = false
allow_direct_cold_storage_measurement = false

[discovery]
gpu_selector = "gpu:any"
topology_command = ["nvidia-smi", "topo", "-m"]
hard_coded_gpu_bundles = false

[adapters]
llama_server = "/home/tumlinson/Software/llama.cpp/build/bin/llama-server"
codex = "/usr/local/bin/codex"
qwen = "qwen"

[policy]
weights_must_be_outside_repository = true
recursive_local_agents = false
idle_model_residency_priority = 5
