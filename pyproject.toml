[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "project-control"
version = "0.3.1"
description = "Architectural observatory with bounded terminal capture for ChatGPT"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "mcp[cli]>=1.0,<2",
  "pydantic>=2.10,<3",
  "pyte>=0.8.2,<1",
  "starlette>=0.41,<1",
  "uvicorn>=0.32,<1",
]

[project.scripts]
project-control = "project_control.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/project_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
