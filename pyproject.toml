[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "project-control"
version = "0.3.2"
description = "Architectural observatory with bounded terminal capture for ChatGPT"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "mcp[cli]>=1.0,<2",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "pyte>=0.8.2,<1",
  "starlette>=0.41,<1",
  "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
  "pytest>=9.1,<10",
]

[project.scripts]
project-control = "project_control.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/project_control", "src/todo_orchestrator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["as1_case(*ids): identifies focused AS1 CPU qualification cases"]
